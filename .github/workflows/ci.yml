name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s pruebas -v
      - name: Ejecutar simulación de operaciones
        run: python main.py
